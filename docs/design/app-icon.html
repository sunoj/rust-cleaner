<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  #art { width:256px; height:256px; transform-origin:top left; }
</style>
</head>
<body>
<div id="art">
  <div style="width:256px; height:256px; position:relative; border-radius:57px; overflow:hidden; background:linear-gradient(158deg, #FAF7F2 0%, #E4E0D8 46%, #C6C3BC 100%)">

    <div style="position:absolute; left:54px; top:112px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(26,74,190,.7), rgba(26,74,190,0) 66%); filter:blur(8px)"></div>
    <div style="position:absolute; left:132px; top:-84px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.6), rgba(255,255,255,0) 66%); filter:blur(8px)"></div>
    <div style="position:absolute; left:150px; top:150px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(122,116,104,.42), rgba(0,0,0,0) 70%); filter:blur(10px)"></div>

    <div style="position:absolute; left:84px; top:230px; width:88px; height:14px; border-radius:50%; background:rgba(14,20,26,.42); filter:blur(7px)"></div>

    <div style="position:absolute; left:82px; top:66px; width:92px; height:32px; clip-path:polygon(29% 0, 71% 0, 100% 100%, 0 100%); background:linear-gradient(178deg, rgba(255,255,255,.98) 0%, rgba(234,240,247,.96) 20%, rgba(192,203,218,.94) 56%, rgba(128,143,165,.92) 100%); backdrop-filter:blur(7px) saturate(135%); -webkit-backdrop-filter:blur(7px) saturate(135%); box-shadow:inset 0 2px 3px rgba(255,255,255,.95), inset 9px 0 10px rgba(255,255,255,.5), inset -9px 0 12px rgba(20,28,44,.34), inset -4px -5px 9px rgba(14,20,26,.3)"></div>

    <div style="position:absolute; left:107px; top:56px; width:42px; height:14px; border-radius:3px; background:linear-gradient(96deg, rgba(112,126,148,.95) 0%, rgba(248,251,254,.96) 22%, rgba(196,206,220,.95) 58%, rgba(96,110,132,.95) 100%); box-shadow:inset 0 -2px 3px rgba(14,20,30,.38), inset 0 1px 0 rgba(255,255,255,.85)"></div>

    <div style="position:absolute; left:101px; top:38px; width:54px; height:22px; border-radius:7px 7px 4px 4px; background:linear-gradient(96deg, rgba(128,16,14,.95) 0%, rgba(246,110,88,.96) 20%, rgba(214,52,38,.95) 54%, rgba(120,14,12,.95) 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 5px rgba(70,6,6,.45), 0 3px 7px rgba(10,16,30,.3)"></div>
    <div style="position:absolute; left:104px; top:41px; width:34px; height:4px; border-radius:3px; background:rgba(255,255,255,.4); filter:blur(1.4px)"></div>

    <div style="position:absolute; left:80px; top:84px; width:96px; height:152px; border-radius:15px 15px 26px 26px; background:linear-gradient(105deg, rgba(46,96,208,.62) 0%, rgba(18,50,148,.74) 46%, rgba(52,104,214,.6) 100%); backdrop-filter:blur(7px) saturate(135%); -webkit-backdrop-filter:blur(7px) saturate(135%); border:1px solid rgba(255,255,255,.44); box-shadow:inset 2px 3px 7px rgba(255,255,255,.55), inset -3px -5px 12px rgba(14,20,26,.32), 0 12px 24px rgba(14,20,26,.3); overflow:hidden">
      <div style="position:absolute; left:0; top:58px; right:0; height:46px; background:linear-gradient(180deg, rgba(250,208,60,.94), rgba(224,168,26,.88)); backdrop-filter:blur(3px) saturate(170%); -webkit-backdrop-filter:blur(3px) saturate(170%); box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.3); overflow:hidden">
        <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(70,40,0,.42) 0%, rgba(255,255,255,.55) 17%, rgba(255,255,255,.12) 44%, rgba(70,40,0,.16) 74%, rgba(60,34,0,.48) 100%)"></div>
      </div>
      <div style="position:absolute; left:7px; top:8px; width:12px; height:134px; border-radius:7px; background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.06)); filter:blur(2px)"></div>
      <div style="position:absolute; right:6px; top:10px; width:6px; height:126px; border-radius:4px; background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.04)); filter:blur(2.5px)"></div>
      <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(4,14,40,.5) 0%, rgba(255,255,255,.34) 16%, rgba(255,255,255,.06) 42%, rgba(4,14,40,.2) 72%, rgba(4,14,40,.55) 100%)"></div>
      <div style="position:absolute; left:0; right:0; top:0; height:7px; background:linear-gradient(90deg, rgba(120,132,152,.9), rgba(246,249,252,.95) 22%, rgba(190,200,214,.9) 55%, rgba(96,108,128,.92) 100%); box-shadow:inset 0 -1px 2px rgba(10,16,30,.4)"></div>
      <div style="position:absolute; left:0; right:0; bottom:0; height:11px; border-radius:0 0 26px 26px; background:linear-gradient(90deg, rgba(84,96,116,.92), rgba(228,234,242,.9) 20%, rgba(160,172,190,.88) 56%, rgba(70,82,102,.94) 100%); box-shadow:inset 0 2px 3px rgba(10,16,30,.45)"></div>
      <div style="position:absolute; left:0; right:0; bottom:11px; height:18px; background:linear-gradient(180deg, rgba(6,14,34,0), rgba(6,14,34,.3)); filter:blur(2px)"></div>
    </div>

    <div style="position:absolute; left:86px; top:70px; width:66px; height:11px; border-radius:6px; background:rgba(8,14,28,.3); filter:blur(4px)"></div>

    <div style="position:absolute; left:80px; top:52px; width:9px; height:96px; border-radius:5px; background:linear-gradient(96deg, rgba(104,10,10,.95) 0%, rgba(236,80,60,.96) 38%, rgba(158,22,18,.95) 100%); box-shadow:0 2px 5px rgba(10,16,30,.4), inset 0 1px 0 rgba(255,255,255,.3)"></div>

    <div style="position:absolute; left:72px; top:26px; width:84px; height:32px; border-radius:19px 12px 9px 20px; transform:rotate(-2deg); background:linear-gradient(168deg, rgba(255,186,168,.97) 0%, rgba(242,98,76,.97) 26%, rgba(206,44,32,.96) 62%, rgba(126,14,12,.95) 100%); box-shadow:0 4px 9px rgba(10,16,30,.34), inset 0 2px 0 rgba(255,255,255,.6), inset -3px -4px 7px rgba(80,8,8,.42); overflow:hidden">
      <div style="position:absolute; left:10px; top:5px; width:44px; height:6px; border-radius:4px; background:rgba(255,255,255,.55); filter:blur(1.6px)"></div>
      <div style="position:absolute; left:6px; top:14px; width:20px; height:14px; border-radius:10px; background:radial-gradient(120% 120% at 30% 24%, rgba(255,206,192,.7), rgba(180,28,22,.15) 70%)"></div>
    </div>

    <div style="position:absolute; left:83px; top:84px; width:90px; height:3px; border-radius:2px; background:rgba(255,255,255,.62); filter:blur(1.4px)"></div>
    <div style="position:absolute; inset:0; border-radius:57px; box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.14)"></div>
  </div>
</div>
<script>
  const px = parseInt(new URLSearchParams(location.search).get('px') || '256', 10);
  document.getElementById('art').style.transform = 'scale(' + (px / 256) + ')';
  document.documentElement.style.width = px + 'px';
  document.documentElement.style.height = px + 'px';
</script>
</body>
</html>
